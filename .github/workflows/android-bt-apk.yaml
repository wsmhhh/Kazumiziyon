---
    name: "Android BT APK"

    # 手动触发：GitHub 仓库页面 → Actions → Android BT APK → Run workflow
    # 构建产物在本次运行的 Artifacts 里下载（Kazumi-BT-arm64-apk）。
    on:
      workflow_dispatch:

    jobs:
      build-android:
        name: "Build arm64 APK with aria2"
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4

          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'

          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version: '3.47.8'

          # 从 abcfy2/aria2-static-build 下载静态 aria2c，放进 jniLibs。
          - name: Bundle aria2c (BT engine)
            run: |
              chmod +x tool/fetch_aria2_android.sh tool/package_aria2_android.sh
              tool/fetch_aria2_android.sh arm64-v8a
            shell: bash

          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash

          # 没有配置密钥也能构建，只是 DanDanPlay 弹幕会不可用。
          - name: Build APK
            run: >-
              flutter build apk --release --split-per-abi
              --dart-define=DANDANAPI_APPID=${{ secrets.DANDANAPI_APPID }}
              --dart-define=DANDANAPI_KEY=${{ secrets.DANDANAPI_KEY }}
              --dart-define=KAZUMI_APPID=${{ secrets.KAZUMI_APPID }}
              --dart-define=KAZUMI_KEY=${{ secrets.KAZUMI_KEY }}
            shell: bash

          - name: Upload APK
            uses: actions/upload-artifact@v4
            with:
              name: Kazumi-BT-arm64-apk
              path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
              if-no-files-found: error
